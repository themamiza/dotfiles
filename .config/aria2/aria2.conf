# Resume partial downloads
continue=true

# Parallel downloads
max-concurrent-downloads=4

# Connections used for one file
split=8
max-connection-per-server=8
#min-split-size=20M

# Retry failed downloads
max-tries=10
retry-wait=3

# Network timeouts
connect-timeout=15
#timeout=60

# Disk / filesystem
file-allocation=none
disk-cache=64M

# Preserve server timestamps
remote-time=true

# Console
summary-interval=5

# Don't unexpectedly overwrite existing files
allow-overwrite=false
